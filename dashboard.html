<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EMR Dashboard</title>

<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="dashboard.css">
<link rel="stylesheet" href="sidebar.css">
<link rel="stylesheet" href="topbar.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<script src="theme.js"></script>
<script src="auth.js"></script>
<script>EMR_AUTH.requireAccess();</script>

</head>
<body>

<aside id="appSidebar" data-page="dashboard"></aside>

<!-- Main -->
<div class="main app-main">
    
<!-- Navbar -->
<header id="appTopbar">
    <div class="search"><i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" placeholder="Search patients, encounters, prescriptions...">
    </div>
</header>


<!-- DASHBOARD INTRO -->
<section class="dashboard-intro">

    <div class="greeting">
        <h1 id="greetingText">Good Morning, <span data-auth-name>Admin</span> 👋</h1>
    </div>

</section>


<!-- SUMMARY CARDS -->
<section class="summary-cards">

    <!-- TOTAL PATIENTS -->
    <div class="summary-card">

        <div class="card-icon">
            👥
        </div>

        <div class="card-content">
            <p>Total Patients</p>
            <h2>0</h2>
            <span>Registered patients</span>
        </div>

    </div>


    <!-- APPOINTMENTS -->
    <div class="summary-card">

        <div class="card-icon">
            📅
        </div>

        <div class="card-content">
            <p>Appointments</p>
            <h2>0</h2>
            <span>Today's appointments</span>
        </div>

    </div>


    <!-- QUEUE -->
    <div class="summary-card">

        <div class="card-icon">
            🏥
        </div>

        <div class="card-content">
            <p>Patient Queue</p>
            <h2>0</h2>
            <span>Currently waiting</span>
        </div>

    </div>


    <!-- BEDS -->
    <div class="summary-card">

        <div class="card-icon">
            🛏️
        </div>

        <div class="card-content">
            <p>Beds Occupied</p>
            <h2>0 / 50</h2>
            <span>Hospital occupancy</span>
        </div>

    </div>

</section>

</div>

<script>
    EMR_AUTH.applySessionToPage(EMR_AUTH.getSession());
</script>
<script src="dashboard.js"></script>

<script src="sidebar.js"></script>
<script src="topbar.js"></script>
</body>
</html>
