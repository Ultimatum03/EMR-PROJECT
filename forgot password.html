<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emr-Forgot Password</title>
    <link rel="stylesheet" href="style.css">
    </head>
<body>
    <div class="forgot-password-container">
        <!-- Logo -->
        <div class="logo">
            <img src="logo 2.png" alt="Emr Logo">
        </div>
        <!-- EMR Name -->
        <h1>Forgot Password</h1>
        <!-- Forgot Password Section -->
        <div class="forgot-password-section">
            <p class="forgot-password-subtitle">Enter your email to reset your password</p>
            <form class="forgot-password-form">
                <!-- Email -->
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email" required>
                </div>
                <!-- Reset Password Button -->
                <button type="submit" class="reset-password-btn">Reset Password</button>
            </form>
             
            <p class="back-login">
                 <a href="login page.html">←Back to Login</a>
            </p>
        </div>
    </div>
</body>
</html>

<style>
    *{
        margin: auto;
        padding: 0;
        box-sizing: border-box;
    }
    body{
        font-family: Arial, sans-serif;
        background-color: #f4f4f4;
        padding: 20px;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }
    .forgot-password-container {
        background-color: #fff;
        padding: 40px;
        border-radius: 10px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        width: 100%;
        max-width: 400px;
    }
    .forgot-password-container h1{
        text-align: center;
        margin-bottom: 20px;
        color: #333;
        font-size: 25px;
    }
    .forgot-password-subtitle {
        text-align: center;
        margin-bottom: 30px;
        color: #666;
        font-size: 14px;
    }
    .reset-password-btn{
        width: 60%;
        padding: 10px;
        background-color: #007BFF;
        color: #fff;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-size: 16px;
        display:block;
    }
    .reset-password-btn:hover {
        background-color: darkblue;
    }
    .back-login {
        text-align: center;
        margin-top: 20px;
    }
</style>
